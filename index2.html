<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="utf-8">

    <title>Dream On Flight Test_004</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="js/glass-fix.js"></script>

    <style>

        html,
        body {

            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;

        }

    </style>

</head>

<body>

<a-scene
        renderer="colorManagement:true;
                  physicallyCorrectLights:true;"

        embedded>

    <!-- ===================================================== -->
    <!-- Assets -->
    <!-- ===================================================== -->

    <a-assets>

        <video

                id="bgVideo"

                src="Background360test.mp4"

                autoplay
                loop
                muted

                playsinline
                webkit-playsinline

                crossorigin="anonymous">

        </video>

        <a-asset-item

                id="alia"

                src="models/beta_alia_vtol_aircraft.glb">

        </a-asset-item>

    </a-assets>

    <!-- ===================================================== -->
    <!-- 360 Background -->
    <!-- ===================================================== -->

    <a-videosphere

            src="#bgVideo"

            rotation="0 -90 0">

    </a-videosphere>

    <!-- ===================================================== -->
    <!-- Aircraft -->
    <!-- ===================================================== -->

    <a-entity

            id="aircraft"

            gltf-model="#alia"

            animation-mixer="
                clip: Animation;
                loop: repeat;
                repetitions: Infinity;
                timeScale: 300
            "
        
            brighten-glass="
                opacity: 0.18;
                roughness: 0.08
            "

            hide-pilot="nodeName: pilot_31"
        
            position="0.3 -0.3 1.6"

            rotation="0 180 0"

            scale="1 1 1">

    </a-entity>

    <!-- ===================================================== -->
    <!-- Camera -->
    <!-- ===================================================== -->

    <a-entity

            camera

            look-controls

            position="0 0 0">

    </a-entity>

</a-scene>

<script>

const video = document.querySelector("#bgVideo");
const aircraft = document.querySelector("#aircraft");

document.body.addEventListener("click", async () => {

    if (video.paused) {

        try {

            await video.play();

        } catch (e) {

            console.error(e);

        }

    }

});

aircraft.addEventListener("model-loaded", (e) => {

    console.log("GLB Loaded");

    console.log(e.detail.model);

});

aircraft.addEventListener("model-error", (e) => {

    console.error("GLB Load Error");

    console.error(e.detail);

});

</script>

</body>

</html>
