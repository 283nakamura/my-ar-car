<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Remote Pilot UI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; display:flex; font-family:sans-serif; background:#0f172a; color:white; }
#map { width:70vw; height:100vh; }

#sidebar {
  width:30vw;
  padding:15px;
  background:#111827;
  overflow-y:auto;
}

/* セクション */
.section {
  background:#1e293b;
  padding:12px;
  margin-bottom:14px;
  border-radius:10px;
}

.alert-item {
  background:#1f2937;
  padding:8px;
  margin-bottom:8px;
  cursor:pointer;
  border-left:4px solid red;
}

/* 車アイコン */
.car-icon { font-size:16px; }
.alert-blink { animation:blink 1s infinite; }
@keyframes blink { 50% {opacity:0.3;} }

/* ボタン */
button {
  width:100%;
  padding:10px;
  margin-top:6px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#334155;
  color:white;
}
.primary { background:#2563eb; }
.danger { background:#dc2626; }
.success { background:#16a34a; }

/* カメラ */
.camera-wrap {
  height:180px;
  border-radius:8px;
  overflow:hidden;
  position:relative;
  background:black;
}
#cameraVideo {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ステータス */
.row {
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-size:14px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">

<!-- ===== ① 全体状況 ===== -->
<div class="section">
<h3>📊 全体状況</h3>
<div class="row"><span>総車両数</span><span id="total">0</span></div>
<div class="row"><span>正常</span><span id="normal">0</span></div>
<div class="row"><span>異常</span><span id="alert">0</span></div>
</div>

<!-- ===== ② アラート一覧 ===== -->
<div class="section">
<h3>🚨 アラート一覧</h3>
<div id="alerts"></div>
<button onclick="resetView()">全体表示</button>
</div>

<!-- ===== ③ フォーカス ===== -->
<div class="section" id="focusPanel" style="display:none;">
<h3>🎯 フォーカス</h3>

<div class="camera-wrap">
  <video id="cameraVideo" muted autoplay loop playsinline controls>
    <source src="./assets/dashcam.mp4" type="video/mp4">
  </video>
</div>

<p id="scenario"></p>

<button class="danger" onclick="stopCar()">停止</button>
<button onclick="evade('left')">左回避</button>
<button onclick="evade('right')">右回避</button>
<button class="success" onclick="resume()">自動復帰</button>

</div>

</div>

<script>

// ===== 地図 =====
const center=[35.6812,139.7671];
const map=L.map('map').setView(center,15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== 車 =====
let cars=[];
const dirs=[[0.0001,0],[-0.0001,0],[0,0.0001],[0,-0.0001]];

function icon(color){
  return L.divIcon({
    html:`<div class="car-icon ${color==="red"?"alert-blink":""}" style="color:${color}">🚗</div>`
  });
}

for(let i=0;i<20;i++){
  let lat=center[0]+(Math.random()-0.5)*0.01;
  let lng=center[1]+(Math.random()-0.5)*0.01;

  let marker=L.marker([lat,lng],{icon:icon("green")}).addTo(map);

  cars.push({
    id:i,
    lat,lng,
    marker,
    dir:dirs[Math.floor(Math.random()*4)],
    speed:Math.random()*1.5+0.5,
    alert:false
  });
}

// ===== 移動 =====
function moveCars(){
  cars.forEach(c=>{
    if(c.alert) return;
    c.lat+=c.dir[0]*c.speed;
    c.lng+=c.dir[1]*c.speed;
    c.marker.setLatLng([c.lat,c.lng]);
  });
}

// ===== 状況更新 =====
function updateStats(){
  document.getElementById("total").innerText=cars.length;
  document.getElementById("alert").innerText=cars.filter(c=>c.alert).length;
  document.getElementById("normal").innerText=cars.filter(c=>!c.alert).length;
}

// ===== アラート（1件のみ） =====
function triggerAlert(){
  if(cars.some(c=>c.alert)) return; // ←ここ重要

  if(Math.random()<0.7) return; // 発生頻度低め

  let target=cars[Math.floor(Math.random()*cars.length)];

  target.alert=true;
  target.marker.setIcon(icon("red"));

  addAlertUI(target);
  updateStats();
}

// ===== UI =====
let focused=null;

function addAlertUI(car){
  const div=document.createElement("div");
  div.className="alert-item";
  div.innerText=`車両 ${car.id} 異常`;

  div.onclick=()=>{
    focused=car;
    map.setView([car.lat,car.lng],18);
    document.getElementById("focusPanel").style.display="block";
    document.getElementById("scenario").innerText="前方に障害物あり";

    // 動画再生
    const video=document.getElementById("cameraVideo");
    video.currentTime=0;
    video.play();
  };

  document.getElementById("alerts").innerHTML="";
  document.getElementById("alerts").appendChild(div);
}

// ===== 操作 =====
function stopCar(){
  if(!focused) return;
  focused.speed=0;
}

function evade(side){
  if(!focused) return;
  focused.dir = side==="left" ? dirs[2] : dirs[3];
  resolve();
}

function resume(){
  if(!focused) return;
  focused.speed=1;
  resolve();
}

function resolve(){
  focused.alert=false;
  focused.marker.setIcon(icon("green"));
  document.getElementById("alerts").innerHTML="";
  updateStats();
}

// ===== リセット =====
function resetView(){
  map.setView(center,15);
}

// ===== 実行 =====
setInterval(moveCars,200);
setInterval(triggerAlert,8000);
updateStats();

</script>

</body>
</html>
