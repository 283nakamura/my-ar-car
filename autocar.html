<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Remote Pilot UI Prototype</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      font-family: sans-serif;
      background: #0f172a;
      color: white;
    }

    #map {
      width: 70vw;
      height: 100vh;
    }

    #sidebar {
      width: 30vw;
      height: 100vh;
      padding: 15px;
      box-sizing: border-box;
      background: #111827;
      overflow-y: auto;
      border-left: 1px solid #334155;
    }

    .section {
      background: #1e293b;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
    }

    h2, h3 {
      margin-top: 0;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .alert-item {
      background: #1f2937;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border-left: 4px solid red;
      border-radius: 6px;
    }

    .alert-item:hover {
      background: #374151;
    }

    .car-icon {
      font-size: 16px;
    }

    .alert-blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #334155;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #475569;
    }

    .danger {
      background: #dc2626;
    }

    .danger:hover {
      background: #b91c1c;
    }

    .success {
      background: #16a34a;
    }

    .success:hover {
      background: #15803d;
    }

    .camera-wrap {
      height: 190px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: black;
      border: 1px solid #334155;
    }

    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: black;
    }

    .small {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .muted {
      color: #94a3b8;
      font-size: 13px;
    }

    #focusPanel {
      display: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">

    <!-- ① 全体状況 -->
    <div class="section">
      <h3>📊 全体状況</h3>
      <div class="row"><span>総車両数</span><span id="total">0</span></div>
      <div class="row"><span>正常</span><span id="normal">0</span></div>
      <div class="row"><span>異常</span><span id="alert">0</span></div>
    </div>

    <!-- ② アラート一覧 -->
    <div class="section">
      <h3>🚨 アラート一覧</h3>
      <div class="small">
        異常は同時に1件のみ発生し、解決するまでは次の異常は発生しません。
      </div>
      <div id="alerts" style="margin-top: 12px;"></div>
      <button onclick="resetView()">全体表示</button>
    </div>

    <!-- ③ フォーカス画面 -->
    <div class="section" id="focusPanel">
      <h3>🎯 フォーカス</h3>

      <div class="camera-wrap">
        <video id="cameraVideo" muted loop playsinline controls>
          <source src="./assets/dashcam.mp4" type="video/mp4">
        </video>
      </div>

      <p id="scenario" style="margin-top: 10px;">前方に障害物あり</p>

      <button class="danger" onclick="stopCar()">停止</button>
      <button onclick="evade('left')">左回避</button>
      <button onclick="evade('right')">右回避</button>
      <button class="success" onclick="resume()">自動復帰</button>
    </div>

  </div>

  <script>
    // ===== 地図 =====
    const center = [35.6812, 139.7671];
    const map = L.map('map').setView(center, 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ===== 車アイコン =====
    function icon(color) {
      return L.divIcon({
        className: '',
        html: `<div class="car-icon ${color === "red" ? "alert-blink" : ""}" style="color:${color}">🚗</div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    // ===== 車両データ =====
    let cars = [];
    let focused = null;

    const dirs = [
      [ 0.0001,  0      ], // 北
      [-0.0001,  0      ], // 南
      [ 0,       0.0001 ], // 東
      [ 0,      -0.0001 ]  // 西
    ];

    const scenarioList = [
      "前方に障害物あり",
      "工事区間のため進路変更が必要",
      "事故処理のため一時迂回が必要",
      "緊急車両接近のため停止判断が必要"
    ];

    for (let i = 0; i < 20; i++) {
      const lat = center[0] + (Math.random() - 0.5) * 0.01;
      const lng = center[1] + (Math.random() - 0.5) * 0.01;

      const marker = L.marker([lat, lng], {
        icon: icon("green")
      }).addTo(map);

      cars.push({
        id: i,
        lat,
        lng,
        marker,
        dir: dirs[Math.floor(Math.random() * dirs.length)],
        speed: Math.random() * 1.5 + 0.5,
        alert: false,
        baseSpeed: Math.random() * 1.5 + 0.5,
        scenario: ""
      });
    }

    // ===== ステータス更新 =====
    function updateStats() {
      const total = cars.length;
      const alertCount = cars.filter(c => c.alert).length;
      const normalCount = total - alertCount;

      document.getElementById("total").innerText = total;
      document.getElementById("normal").innerText = normalCount;
      document.getElementById("alert").innerText = alertCount;
    }

    // ===== 移動 =====
    function moveCars() {
      cars.forEach(car => {
        if (car.alert) return;

        car.lat += car.dir[0] * car.speed;
        car.lng += car.dir[1] * car.speed;

        // 範囲外に出たら戻す
        const latDiff = Math.abs(car.lat - center[0]);
        const lngDiff = Math.abs(car.lng - center[1]);

        if (latDiff > 0.015 || lngDiff > 0.015) {
          car.lat = center[0] + (Math.random() - 0.5) * 0.01;
          car.lng = center[1] + (Math.random() - 0.5) * 0.01;
          car.dir = dirs[Math.floor(Math.random() * dirs.length)];
        }

        car.marker.setLatLng([car.lat, car.lng]);
      });
    }

    // ===== アラート発生（同時1件のみ） =====
    function triggerAlert() {
      // すでに異常車両があるなら新規発生なし
      if (cars.some(c => c.alert)) return;

      // 発生頻度を低めに調整
      if (Math.random() < 0.7) return;

      const target = cars[Math.floor(Math.random() * cars.length)];
      target.alert = true;
      target.marker.setIcon(icon("red"));
      target.scenario = scenarioList[Math.floor(Math.random() * scenarioList.length)];

      addAlertUI(target);
      updateStats();
    }

    // ===== アラートUI =====
    function addAlertUI(car) {
      const alerts = document.getElementById("alerts");
      alerts.innerHTML = "";

      const div = document.createElement("div");
      div.className = "alert-item";
      div.innerHTML = `<strong>車両 ${car.id}</strong><br><span class="muted">${car.scenario}</span>`;

      // 修正③: クリック時にフォーカス＋動画再生
      div.onclick = () => {
        focused = car;

        map.setView([car.lat, car.lng], 18);
        document.getElementById("focusPanel").style.display = "block";
        document.getElementById("scenario").innerText = car.scenario;

        // 修正① + 修正②
        const video = document.getElementById("cameraVideo");
        video.pause();
        video.currentTime = 0;
        video.muted = true;
        video.play().catch(err => {
          console.log("再生失敗:", err);
        });
      };

      alerts.appendChild(div);
    }

    // ===== 操作 =====
    function stopCar() {
      if (!focused) return;
      focused.speed = 0;
    }

    function evade(side) {
      if (!focused) return;

      // 左右回避を簡易的に別方向へ変更
      if (side === "left") {
        focused.dir = dirs[2];
      } else {
        focused.dir = dirs[3];
      }

      resolveFocusedCar();
    }

    function resume() {
      if (!focused) return;
      focused.speed = focused.baseSpeed || 1;
      resolveFocusedCar();
    }

    function resolveFocusedCar() {
      if (!focused) return;

      focused.alert = false;
      focused.speed = focused.baseSpeed || 1;
      focused.marker.setIcon(icon("green"));

      document.getElementById("alerts").innerHTML = "";
      updateStats();
    }

    // ===== リセット =====
    function resetView() {
      map.setView(center, 15);
    }

    // ===== 実行 =====
    setInterval(moveCars, 200);
    setInterval(triggerAlert, 8000);
    updateStats();
  </script>
</body>
</html>
