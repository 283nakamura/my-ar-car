<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EHang 216 Hover Test</title>

  <!-- A-Frameをオンラインから読み込む -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <script>
    /**
     * 固定カメラを、指定した座標へ一度だけ向けるコンポーネント
     *
     * カメラ自体は移動せず、機体の基準位置を向いた状態で固定されます。
     */
    AFRAME.registerComponent("fixed-look-at", {
      schema: {
        target: {
          type: "vec3",
          default: {
            x: 0,
            y: 1.8,
            z: -6
          }
        }
      },

      init: function () {
        this.updateCameraDirection = () => {
          const target = new THREE.Vector3(
            this.data.target.x,
            this.data.target.y,
            this.data.target.z
          );

          this.el.object3D.lookAt(target);

          /*
           * A-Frameのカメラは、three.jsの通常オブジェクトと
           * 向きが反対になる場合があるため、Y軸を180度補正します。
           */
          this.el.object3D.rotateY(Math.PI);
        };

        if (this.el.sceneEl.hasLoaded) {
          this.updateCameraDirection();
        } else {
          this.el.sceneEl.addEventListener(
            "loaded",
            this.updateCameraDirection,
            { once: true }
          );
        }
      }
    });


    /**
     * EHang 216のローター回転とホバリングを制御するコンポーネント
     *
     * 1. Rotor_CW / Rotor_CCWで始まる全Emptyを自動検出
     * 2. ローターを徐々に加速
     * 3. 機体をゆっくり上下
     * 4. 機体をわずかに前後左右へ傾ける
     */
    AFRAME.registerComponent("ehang-hover-animation", {
      schema: {
        // ローターの最終回転速度
        rotorSpeed: {
          type: "number",
          default: 55
        },

        // 目標回転速度へ近づく速さ
        acceleration: {
          type: "number",
          default: 1.8
        },

        // GLB内のローター回転軸
        rotorAxis: {
          type: "string",
          default: "y"
        },

        // 上下運動の幅（メートル）
        hoverHeight: {
          type: "number",
          default: 0.10
        },

        // 上下運動の速さ
        hoverSpeed: {
          type: "number",
          default: 1.2
        },

        // 前後方向の傾き（度）
        pitchAmount: {
          type: "number",
          default: 0.8
        },

        // 左右方向の傾き（度）
        rollAmount: {
          type: "number",
          default: 1.0
        },

        // 傾きの速さ
        tiltSpeed: {
          type: "number",
          default: 0.7
        }
      },

      init: function () {
        this.rotors = [];

        this.currentRotorSpeed = 0;
        this.targetRotorSpeed = this.data.rotorSpeed;

        this.modelLoaded = false;

        /*
         * HTML側で設定した機体の初期位置と初期回転を記録します。
         * ホバリング中も、この基準値を中心に動かします。
         */
        this.basePosition =
          this.el.object3D.position.clone();

        this.baseRotation =
          this.el.object3D.rotation.clone();

        this.el.addEventListener("model-loaded", () => {
          const model =
            this.el.getObject3D("mesh");

          if (!model) {
            console.error(
              "GLBモデルを取得できませんでした。"
            );

            this.updateStatus(
              "エラー：GLBモデルを取得できませんでした。",
              "error"
            );

            return;
          }

          console.log("EHang 216 GLB loaded.");

          model.traverse((object) => {
            const name = object.name || "";

            if (name.startsWith("Rotor_CW")) {
              this.rotors.push({
                object: object,
                direction: 1,
                name: name
              });

              console.log(
                "CW rotor found:",
                name
              );
            }

            if (name.startsWith("Rotor_CCW")) {
              this.rotors.push({
                object: object,
                direction: -1,
                name: name
              });

              console.log(
                "CCW rotor found:",
                name
              );
            }
          });

          this.modelLoaded = true;

          if (this.rotors.length === 16) {
            this.updateStatus(
              "モデル読込成功：16個のローターを検出しました。",
              "success"
            );
          } else {
            this.updateStatus(
              `モデル読込成功：${this.rotors.length}個のローターを検出しました。`,
              "warning"
            );
          }

          console.log(
            "Detected rotors:",
            this.rotors.map(
              rotor => rotor.name
            )
          );
        });

        this.el.addEventListener(
          "model-error",
          event => {
            console.error(
              "GLBの読み込みに失敗しました。",
              event.detail
            );

            this.updateStatus(
              "GLBの読み込みに失敗しました。ファイル名と配置場所を確認してください。",
              "error"
            );
          }
        );
      },

      updateStatus: function (message, type) {
        const status =
          document.querySelector("#status");

        if (!status) {
          return;
        }

        status.textContent = message;
        status.className = type;
      },

      /**
       * ローター速度を徐々に目標速度へ近づける
       */
      updateRotorSpeed: function (deltaSeconds) {
        const difference =
          this.targetRotorSpeed -
          this.currentRotorSpeed;

        const interpolation =
          Math.min(
            1,
            this.data.acceleration *
            deltaSeconds
          );

        this.currentRotorSpeed +=
          difference * interpolation;
      },

      /**
       * 検出した全ローターを回転させる
       */
      rotateRotors: function (deltaSeconds) {
        const rotationAmount =
          this.currentRotorSpeed *
          deltaSeconds;

        this.rotors.forEach(rotor => {
          const amount =
            rotationAmount *
            rotor.direction;

          if (this.data.rotorAxis === "x") {
            rotor.object.rotation.x +=
              amount;
          } else if (
            this.data.rotorAxis === "y"
          ) {
            rotor.object.rotation.y +=
              amount;
          } else {
            rotor.object.rotation.z +=
              amount;
          }
        });
      },

      /**
       * 機体を上下させる
       */
      updateHoverPosition: function (
        elapsedSeconds
      ) {
        const verticalOffset =
          Math.sin(
            elapsedSeconds *
            this.data.hoverSpeed
          ) *
          this.data.hoverHeight;

        this.el.object3D.position.y =
          this.basePosition.y +
          verticalOffset;
      },

      /**
       * 機体をわずかに前後左右へ傾ける
       */
      updateHoverTilt: function (
        elapsedSeconds
      ) {
        const pitchDegrees =
          Math.sin(
            elapsedSeconds *
            this.data.tiltSpeed
          ) *
          this.data.pitchAmount;

        const rollDegrees =
          Math.sin(
            elapsedSeconds *
            this.data.tiltSpeed *
            0.83 +
            1.4
          ) *
          this.data.rollAmount;

        const pitchRadians =
          THREE.MathUtils.degToRad(
            pitchDegrees
          );

        const rollRadians =
          THREE.MathUtils.degToRad(
            rollDegrees
          );

        this.el.object3D.rotation.x =
          this.baseRotation.x +
          pitchRadians;

        this.el.object3D.rotation.z =
          this.baseRotation.z +
          rollRadians;
      },

      tick: function (time, delta) {
        if (!this.modelLoaded) {
          return;
        }

        const deltaSeconds =
          delta / 1000;

        const elapsedSeconds =
          time / 1000;

        this.updateRotorSpeed(
          deltaSeconds
        );

        this.rotateRotors(
          deltaSeconds
        );

        this.updateHoverPosition(
          elapsedSeconds
        );

        this.updateHoverTilt(
          elapsedSeconds
        );
      }
    });
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 650px;

      padding: 10px 14px;

      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);

      border-radius: 8px;

      font-size: 14px;
      line-height: 1.5;

      pointer-events: none;
    }

    #status.success {
      background: rgba(0, 110, 60, 0.85);
    }

    #status.warning {
      background: rgba(170, 90, 0, 0.88);
    }

    #status.error {
      background: rgba(170, 0, 0, 0.88);
    }
  </style>
</head>

<body>
  <div id="status">
    EHang 216を読み込んでいます。
  </div>

  <a-scene
    background="color: #CFE5F2"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"
  >
    <a-assets timeout="30000">
      <a-asset-item
        id="ehangModel"

        src="./models/Ehang216_for_AFrame_Optimization.glb?v=5"
      ></a-asset-item>
    </a-assets>

    <!-- 環境光 -->
    <a-entity
      light="
        type: ambient;
        color: #FFFFFF;
        intensity: 1.3;
      "
    ></a-entity>

    <!-- 前方左上からの主光源 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 1.8;
      "

      position="-4 7 2"
    ></a-entity>

    <!-- 反対側からの補助光 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 0.7;
      "

      position="4 3 -8"
    ></a-entity>

    <!-- EHang 216 -->
    <a-entity
      id="ehang216"

      gltf-model="#ehangModel"

      ehang-hover-animation="
        rotorSpeed: 55;
        acceleration: 1.8;
        rotorAxis: y;

        hoverHeight: 0.10;
        hoverSpeed: 1.2;

        pitchAmount: 0.8;
        rollAmount: 1.0;
        tiltSpeed: 0.7;
      "

      position="0 1.8 -6"

      rotation="0 180 0"

      scale="1 1 1"
    ></a-entity>

    <!-- 地面 -->
    <a-plane
      position="0 0 -6"

      rotation="-90 0 0"

      width="20"
      height="20"

      color="#AAB7C2"

      roughness="1"
    ></a-plane>

    <!--
      固定カメラ

      機体：
      position="0 1.8 -6"

      カメラ：
      position="-3.5 2.8 -2.5"

      機体の前方左上側から見る想定です。
    -->
    <a-camera
      id="fixedCamera"

      position="-3.5 2.8 -2.5"

      fixed-look-at="
        target: 0 1.8 -6;
      "

      look-controls="enabled: false"

      wasd-controls="enabled: false"
    ></a-camera>
  </a-scene>
</body>
</html>
