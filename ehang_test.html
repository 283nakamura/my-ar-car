<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EHang 216 Rotor Test</title>

  <!-- A-Frameをオンラインから読み込み -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent("spin-test-rotors", {
      schema: {
        speed: {
          type: "number",
          default: 15
        },

        axis: {
          type: "string",
          default: "z"
        }
      },

      init: function () {
        this.rotors = [];

        this.el.addEventListener("model-loaded", () => {
          const model = this.el.getObject3D("mesh");

          if (!model) {
            this.updateStatus(
              "GLBモデルを取得できませんでした。",
              "error"
            );
            return;
          }

          console.log("GLB model loaded.");

          model.traverse((object) => {
            if (object.name) {
              console.log(object.name);
            }

            if (object.name === "Rotor_CW_02") {
              this.rotors.push({
                object: object,
                direction: 1
              });

              console.log("Found Rotor_CW_02");
            }

            if (object.name === "Rotor_CCW_02") {
              this.rotors.push({
                object: object,
                direction: -1
              });

              console.log("Found Rotor_CCW_02");
            }
          });

          if (this.rotors.length === 2) {
            this.updateStatus(
              "成功：上下2つのローターを検出しました。",
              "success"
            );
          } else {
            this.updateStatus(
              `注意：検出できたローターは${this.rotors.length}個です。`,
              "warning"
            );
          }
        });

        this.el.addEventListener("model-error", (event) => {
          console.error("GLB model loading failed.", event.detail);

          this.updateStatus(
            "GLBの読み込みに失敗しました。ファイル名と配置場所を確認してください。",
            "error"
          );
        });
      },

      updateStatus: function (message, type) {
        const status = document.querySelector("#status");

        if (!status) {
          return;
        }

        status.textContent = message;
        status.className = type;
      },

      tick: function (time, delta) {
        if (this.rotors.length === 0) {
          return;
        }

        const deltaSeconds = delta / 1000;
        const rotationAmount =
          this.data.speed * deltaSeconds;

        this.rotors.forEach((rotor) => {
          const amount =
            rotationAmount * rotor.direction;

          if (this.data.axis === "x") {
            rotor.object.rotation.x += amount;
          } else if (this.data.axis === "y") {
            rotor.object.rotation.y += amount;
          } else {
            rotor.object.rotation.z += amount;
          }
        });
      }
    });
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 600px;
      padding: 10px 14px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }

    #status.success {
      background: rgba(0, 110, 60, 0.85);
    }

    #status.warning {
      background: rgba(170, 90, 0, 0.88);
    }

    #status.error {
      background: rgba(170, 0, 0, 0.88);
    }
  </style>
</head>

<body>
  <div id="status">
    EHang 216を読み込んでいます。
  </div>

  <a-scene
    background="color: #CFE5F2"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
  >
    <a-assets timeout="30000">
      <a-asset-item
        id="ehangModel"
        src="./models/Ehang216_for_AFrame_Optimization.glb"
      ></a-asset-item>
    </a-assets>

    <!-- 環境光 -->
    <a-entity
      light="
        type: ambient;
        color: #FFFFFF;
        intensity: 1.3;
      "
    ></a-entity>

    <!-- 主光源 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 1.8;
      "
      position="-4 7 5"
    ></a-entity>

    <!-- 補助光 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 0.8;
      "
      position="4 3 -2"
    ></a-entity>

    <!-- EHang 216 -->
    <a-entity
      id="ehang216"
      gltf-model="#ehangModel"
      spin-test-rotors="
        speed: 15;
        axis: z;
      "
      position="0 1.7 -6"
      rotation="0 180 0"
      scale="1 1 1"
    ></a-entity>

    <!-- 地面 -->
    <a-plane
      position="0 0 -6"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#AAB7C2"
      roughness="1"
    ></a-plane>

    <!-- カメラ -->
    <a-entity position="0 1.6 0">
      <a-camera
        look-controls="enabled: true"
        wasd-controls="enabled: true"
      ></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
