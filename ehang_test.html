<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EHang 216 Hover Test</title>

  <!-- オンラインでA-Frameを読み込み -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <script>
    /**
     * EHang 216のローター回転とホバリングを制御するコンポーネント
     *
     * 対応内容：
     * 1. Rotor_CW / Rotor_CCWで始まる全Emptyを自動検出
     * 2. ローターを徐々に加速
     * 3. 機体をゆっくり上下
     * 4. 機体をわずかに前後左右へ傾ける
     */
    AFRAME.registerComponent("ehang-hover-animation", {
      schema: {
        // ローターの最終回転速度
        rotorSpeed: {
          type: "number",
          default: 55
        },

        // 回転速度が目標値へ近づく速さ
        acceleration: {
          type: "number",
          default: 1.8
        },

        // GLB内で確認できたローター回転軸
        rotorAxis: {
          type: "string",
          default: "x"
        },

        // 上下運動の幅。単位はメートル
        hoverHeight: {
          type: "number",
          default: 0.12
        },

        // 上下運動の速さ
        hoverSpeed: {
          type: "number",
          default: 1.3
        },

        // 前後方向の傾き。単位は度
        pitchAmount: {
          type: "number",
          default: 1.2
        },

        // 左右方向の傾き。単位は度
        rollAmount: {
          type: "number",
          default: 1.5
        },

        // 傾きの速さ
        tiltSpeed: {
          type: "number",
          default: 0.75
        }
      },

      init: function () {
        this.rotors = [];

        this.currentRotorSpeed = 0;
        this.targetRotorSpeed = this.data.rotorSpeed;

        this.modelLoaded = false;

        // HTML側で設定された機体の初期位置・回転を記録
        this.basePosition = this.el.object3D.position.clone();
        this.baseRotation = this.el.object3D.rotation.clone();

        this.el.addEventListener("model-loaded", () => {
          const model = this.el.getObject3D("mesh");

          if (!model) {
            console.error("GLBモデルを取得できませんでした。");
            this.updateStatus(
              "エラー：GLBモデルを取得できませんでした。",
              "error"
            );
            return;
          }

          console.log("EHang 216 GLB loaded.");

          model.traverse((object) => {
            const name = object.name || "";

            if (name.startsWith("Rotor_CW")) {
              this.rotors.push({
                object: object,
                direction: 1,
                name: name
              });

              console.log("CW rotor found:", name);
            }

            if (name.startsWith("Rotor_CCW")) {
              this.rotors.push({
                object: object,
                direction: -1,
                name: name
              });

              console.log("CCW rotor found:", name);
            }
          });

          this.modelLoaded = true;

          this.updateStatus(
            `モデル読込成功：${this.rotors.length}個のローターを検出しました。`,
            this.rotors.length > 0 ? "success" : "warning"
          );

          console.log(
            "Detected rotors:",
            this.rotors.map((rotor) => rotor.name)
          );
        });

        this.el.addEventListener("model-error", (event) => {
          console.error("GLBの読み込みに失敗しました。", event.detail);

          this.updateStatus(
            "GLBの読み込みに失敗しました。ファイル名と配置場所を確認してください。",
            "error"
          );
        });
      },

      updateStatus: function (message, type) {
        const status = document.querySelector("#status");

        if (!status) {
          return;
        }

        status.textContent = message;
        status.className = type;
      },

      /**
       * 回転速度を徐々に目標値へ近づける
       */
      updateRotorSpeed: function (deltaSeconds) {
        const difference =
          this.targetRotorSpeed - this.currentRotorSpeed;

        const step =
          difference *
          Math.min(1, this.data.acceleration * deltaSeconds);

        this.currentRotorSpeed += step;
      },

      /**
       * ローターを回転させる
       */
      rotateRotors: function (deltaSeconds) {
        const rotationAmount =
          this.currentRotorSpeed * deltaSeconds;

        this.rotors.forEach((rotor) => {
          const amount =
            rotationAmount * rotor.direction;

          if (this.data.rotorAxis === "x") {
            rotor.object.rotation.x += amount;
          } else if (this.data.rotorAxis === "y") {
            rotor.object.rotation.y += amount;
          } else {
            rotor.object.rotation.z += amount;
          }
        });
      },

      /**
       * 機体を上下させる
       */
      updateHoverPosition: function (elapsedSeconds) {
        const verticalOffset =
          Math.sin(
            elapsedSeconds * this.data.hoverSpeed
          ) * this.data.hoverHeight;

        this.el.object3D.position.y =
          this.basePosition.y + verticalOffset;
      },

      /**
       * 機体をわずかに前後左右へ傾ける
       */
      updateHoverTilt: function (elapsedSeconds) {
        const pitchRadians =
          THREE.MathUtils.degToRad(
            Math.sin(
              elapsedSeconds * this.data.tiltSpeed
            ) * this.data.pitchAmount
          );

        const rollRadians =
          THREE.MathUtils.degToRad(
            Math.sin(
              elapsedSeconds *
              this.data.tiltSpeed *
              0.83 +
              1.4
            ) * this.data.rollAmount
          );

        // A-Frame / three.jsでは、
        // Xが前後傾斜、Zが左右傾斜になることが多い
        this.el.object3D.rotation.x =
          this.baseRotation.x + pitchRadians;

        this.el.object3D.rotation.z =
          this.baseRotation.z + rollRadians;
      },

      tick: function (time, delta) {
        if (!this.modelLoaded) {
          return;
        }

        const deltaSeconds = delta / 1000;
        const elapsedSeconds = time / 1000;

        this.updateRotorSpeed(deltaSeconds);
        this.rotateRotors(deltaSeconds);
        this.updateHoverPosition(elapsedSeconds);
        this.updateHoverTilt(elapsedSeconds);
      }
    });
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 650px;
      padding: 10px 14px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
    }

    #status.success {
      background: rgba(0, 110, 60, 0.85);
    }

    #status.warning {
      background: rgba(170, 90, 0, 0.88);
    }

    #status.error {
      background: rgba(170, 0, 0, 0.88);
    }
  </style>
</head>

<body>
  <div id="status">
    EHang 216を読み込んでいます。
  </div>

  <a-scene
    background="color: #CFE5F2"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
  >
    <a-assets timeout="30000">
      <a-asset-item
        id="ehangModel"
        src="./models/Ehang216_for_AFrame_Optimization.glb"
      ></a-asset-item>
    </a-assets>

    <!-- 環境光 -->
    <a-entity
      light="
        type: ambient;
        color: #FFFFFF;
        intensity: 1.3;
      "
    ></a-entity>

    <!-- 主光源 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 1.8;
      "
      position="-4 7 5"
    ></a-entity>

    <!-- 補助光 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 0.7;
      "
      position="4 3 -2"
    ></a-entity>

    <!-- EHang 216 -->
    <a-entity
      id="ehang216"
      gltf-model="#ehangModel"
      ehang-hover-animation="
        rotorSpeed: 55;
        acceleration: 1.8;
        rotorAxis: x;
        hoverHeight: 0.12;
        hoverSpeed: 1.3;
        pitchAmount: 1.2;
        rollAmount: 1.5;
        tiltSpeed: 0.75;
      "
      position="0 1.8 -6"
      rotation="0 180 0"
      scale="1 1 1"
    ></a-entity>

    <!-- 機体の影が見やすいように地面を配置 -->
    <a-plane
      position="0 0 -6"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#AAB7C2"
      roughness="1"
    ></a-plane>

    <!-- カメラ -->
    <a-entity position="0 1.6 0">
      <a-camera
        look-controls="enabled: true"
        wasd-controls="enabled: true"
      ></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
