<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  >

  <title>EHang 216 Hover Test</title>

  <!-- A-Frameをオンラインから読み込み -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <script>
    /**
     * EHang 216のローター回転とホバリングを制御
     *
     * ・Rotor_CWで始まるEmptyを時計回り
     * ・Rotor_CCWで始まるEmptyを反時計回り
     * ・ローターを徐々に加速
     * ・機体を上下にホバリング
     * ・機体をわずかに前後左右へ傾ける
     */
    AFRAME.registerComponent("ehang-hover-animation", {
      schema: {
        // ローターの最終回転速度
        rotorSpeed: {
          type: "number",
          default: 55
        },

        // 最終回転速度へ近づく速さ
        acceleration: {
          type: "number",
          default: 1.8
        },

        // 動作確認済みの回転軸
        rotorAxis: {
          type: "string",
          default: "y"
        },

        // ホバリングの上下幅（m）
        hoverHeight: {
          type: "number",
          default: 0.10
        },

        // ホバリングの速さ
        hoverSpeed: {
          type: "number",
          default: 1.2
        },

        // 前後方向への傾き（度）
        pitchAmount: {
          type: "number",
          default: 0.8
        },

        // 左右方向への傾き（度）
        rollAmount: {
          type: "number",
          default: 1.0
        },

        // 傾き変化の速さ
        tiltSpeed: {
          type: "number",
          default: 0.7
        }
      },

      init: function () {
        this.rotors = [];
        this.modelLoaded = false;

        this.currentRotorSpeed = 0;
        this.targetRotorSpeed = this.data.rotorSpeed;

        // HTMLで設定した機体の初期位置と初期回転を保存
        this.basePosition = this.el.object3D.position.clone();
        this.baseRotation = this.el.object3D.rotation.clone();

        this.el.addEventListener("model-loaded", () => {
          const model = this.el.getObject3D("mesh");

          if (!model) {
            console.error("GLBモデルを取得できませんでした。");

            this.updateStatus(
              "エラー：GLBモデルを取得できませんでした。",
              "error"
            );

            return;
          }

          console.log("EHang 216 GLB loaded.");

          model.traverse((object) => {
            const name = object.name || "";

            if (name.startsWith("Rotor_CW")) {
              this.rotors.push({
                object: object,
                direction: 1,
                name: name
              });

              console.log("CW rotor found:", name);
            }

            if (name.startsWith("Rotor_CCW")) {
              this.rotors.push({
                object: object,
                direction: -1,
                name: name
              });

              console.log("CCW rotor found:", name);
            }
          });

          this.modelLoaded = true;

          if (this.rotors.length === 16) {
            this.updateStatus(
              "モデル読込成功：16個のローターを検出しました。",
              "success"
            );
          } else {
            this.updateStatus(
              `モデル読込成功：${this.rotors.length}個のローターを検出しました。`,
              "warning"
            );
          }

          console.log(
            "Detected rotors:",
            this.rotors.map((rotor) => rotor.name)
          );
        });

        this.el.addEventListener("model-error", (event) => {
          console.error(
            "GLBの読み込みに失敗しました。",
            event.detail
          );

          this.updateStatus(
            "GLBの読み込みに失敗しました。ファイル名と配置場所を確認してください。",
            "error"
          );
        });
      },

      updateStatus: function (message, type) {
        const status = document.querySelector("#status");

        if (!status) {
          return;
        }

        status.textContent = message;
        status.className = type;
      },

      /**
       * ローター速度を徐々に目標値へ近づける
       */
      updateRotorSpeed: function (deltaSeconds) {
        const difference =
          this.targetRotorSpeed - this.currentRotorSpeed;

        const interpolation =
          Math.min(
            1,
            this.data.acceleration * deltaSeconds
          );

        this.currentRotorSpeed +=
          difference * interpolation;
      },

      /**
       * 検出した全ローターを回転させる
       */
      rotateRotors: function (deltaSeconds) {
        const rotationAmount =
          this.currentRotorSpeed * deltaSeconds;

        this.rotors.forEach((rotor) => {
          const amount =
            rotationAmount * rotor.direction;

          if (this.data.rotorAxis === "x") {
            rotor.object.rotation.x += amount;
          } else if (this.data.rotorAxis === "y") {
            rotor.object.rotation.y += amount;
          } else {
            rotor.object.rotation.z += amount;
          }
        });
      },

      /**
       * 機体をゆっくり上下させる
       */
      updateHoverPosition: function (elapsedSeconds) {
        const verticalOffset =
          Math.sin(
            elapsedSeconds * this.data.hoverSpeed
          ) * this.data.hoverHeight;

        this.el.object3D.position.y =
          this.basePosition.y + verticalOffset;
      },

      /**
       * 機体をわずかに前後左右へ傾ける
       */
      updateHoverTilt: function (elapsedSeconds) {
        const pitchDegrees =
          Math.sin(
            elapsedSeconds * this.data.tiltSpeed
          ) * this.data.pitchAmount;

        const rollDegrees =
          Math.sin(
            elapsedSeconds *
            this.data.tiltSpeed *
            0.83 +
            1.4
          ) * this.data.rollAmount;

        const pitchRadians =
          THREE.MathUtils.degToRad(pitchDegrees);

        const rollRadians =
          THREE.MathUtils.degToRad(rollDegrees);

        this.el.object3D.rotation.x =
          this.baseRotation.x + pitchRadians;

        this.el.object3D.rotation.z =
          this.baseRotation.z + rollRadians;
      },

      tick: function (time, delta) {
        if (!this.modelLoaded) {
          return;
        }

        const deltaSeconds = delta / 1000;
        const elapsedSeconds = time / 1000;

        this.updateRotorSpeed(deltaSeconds);
        this.rotateRotors(deltaSeconds);
        this.updateHoverPosition(elapsedSeconds);
        this.updateHoverTilt(elapsedSeconds);
      }
    });
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #status {
      position: fixed;
      z-index: 10;

      top: 12px;
      left: 12px;
      right: 12px;

      max-width: 650px;
      padding: 10px 14px;

      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);

      border-radius: 8px;

      font-size: 14px;
      line-height: 1.5;

      pointer-events: none;
    }

    #status.success {
      background: rgba(0, 110, 60, 0.85);
    }

    #status.warning {
      background: rgba(170, 90, 0, 0.88);
    }

    #status.error {
      background: rgba(170, 0, 0, 0.88);
    }

    #guide {
      position: fixed;
      z-index: 10;

      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);

      padding: 8px 14px;

      color: #ffffff;
      background: rgba(0, 0, 0, 0.62);

      border-radius: 20px;

      font-size: 13px;
      white-space: nowrap;

      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">
    EHang 216を読み込んでいます。
  </div>

  <div id="guide">
    ドラッグまたはスマートフォンを動かして周囲を見回せます
  </div>

  <a-scene
    background="color: #CFE5F2"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"
  >
    <a-assets timeout="30000">
      <a-asset-item
        id="ehangModel"
        src="./models/Ehang216_for_AFrame_Optimization.glb?v=6"
      ></a-asset-item>
    </a-assets>

    <!-- 環境光 -->
    <a-entity
      light="
        type: ambient;
        color: #FFFFFF;
        intensity: 1.3;
      "
    ></a-entity>

    <!-- 主光源 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 1.8;
      "
      position="-8 12 4"
    ></a-entity>

    <!-- 補助光 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 0.7;
      "
      position="8 5 -10"
    ></a-entity>

    <!-- EHang 216 -->
    <a-entity
      id="ehang216"

      gltf-model="#ehangModel"

      ehang-hover-animation="
        rotorSpeed: 20;
        acceleration: 1.8;
        rotorAxis: y;

        hoverHeight: 0.10;
        hoverSpeed: 1.2;

        pitchAmount: 0.8;
        rollAmount: 1.0;
        tiltSpeed: 0.7;
      "

      position="0 4 -12"
      rotation="0 180 0"
      scale="1 1 1"
    ></a-entity>

    <!-- 地面 -->
    <a-plane
      position="0 0 -12"
      rotation="-90 0 0"

      width="50"
      height="50"

      color="#AAB7C2"
      roughness="1"
    ></a-plane>

    <!--
      カメラの位置は固定しますが、角度は固定しません。

      desktop：
      マウスドラッグで360度見回し

      smartphone：
      指ドラッグ、または端末の向きで見回し
    -->
    <a-entity
      id="cameraRig"
      position="800 500 -20"
      rotation="-5 -35 180"
    >
      <a-camera
        id="mainCamera"

        look-controls="
          enabled: true;
          magicWindowTrackingEnabled: true;
          touchEnabled: true;
          mouseEnabled: true;
          reverseMouseDrag: false;
        "

        wasd-controls="enabled: false"

        cursor="rayOrigin: mouse"
      ></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
