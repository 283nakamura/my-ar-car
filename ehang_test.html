<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  >

  <title>EHang 216 Hover Test</title>

  <!-- A-Frameをオンラインから読み込み -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <script>
    /**
     * 初期表示時だけカメラを対象物へ向けるコンポーネント。
     *
     * 初期設定後はlook-controlsによって、
     * マウス、タッチ、スマートフォンの向きで自由に見回せます。
     */
    AFRAME.registerComponent("initial-look-at", {
      schema: {
        target: {
          type: "selector"
        },

        // 機体の原点ではなく、少し上側を見るための補正
        targetOffsetY: {
          type: "number",
          default: 0
        }
      },

      init: function () {
        this.directionWasSet = false;

        this.setInitialDirection =
          this.setInitialDirection.bind(this);

        /*
         * A-Frame全体の読み込み後に一度実行します。
         */
        if (this.el.sceneEl.hasLoaded) {
          requestAnimationFrame(this.setInitialDirection);
        } else {
          this.el.sceneEl.addEventListener(
            "loaded",
            () => {
              requestAnimationFrame(
                this.setInitialDirection
              );
            },
            { once: true }
          );
        }

        /*
         * GLBの読み込み後にも実行します。
         * こちらが実際の初期視線設定の本命です。
         */
        const targetEl = this.data.target;

        if (targetEl) {
          targetEl.addEventListener(
            "model-loaded",
            () => {
              /*
               * look-controlsの初期化とGLBの反映を待つため、
               * 2フレーム待って設定します。
               */
              requestAnimationFrame(() => {
                requestAnimationFrame(
                  this.setInitialDirection
                );
              });
            },
            { once: true }
          );
        }
      },

      setInitialDirection: function () {
        const targetEl = this.data.target;

        const lookControls =
          this.el.components["look-controls"];

        if (!targetEl || !lookControls) {
          console.warn(
            "initial-look-at: targetまたはlook-controlsが準備できていません。"
          );

          return;
        }

        /*
         * look-controls内部のyawObjectとpitchObjectが
         * 作られていることを確認します。
         */
        if (
          !lookControls.yawObject ||
          !lookControls.pitchObject
        ) {
          console.warn(
            "initial-look-at: yawObjectまたはpitchObjectがありません。"
          );

          return;
        }

        const cameraPosition =
          new THREE.Vector3();

        const targetPosition =
          new THREE.Vector3();

        /*
         * カメラと機体のワールド座標を取得します。
         */
        this.el.object3D.getWorldPosition(
          cameraPosition
        );

        targetEl.object3D.getWorldPosition(
          targetPosition
        );

        /*
         * 機体の中心より少し上を見る場合の補正です。
         */
        targetPosition.y +=
          this.data.targetOffsetY;

        const direction =
          targetPosition
            .clone()
            .sub(cameraPosition);

        /*
         * カメラから機体までの水平距離。
         */
        const horizontalDistance =
          Math.sqrt(
            direction.x * direction.x +
            direction.z * direction.z
          );

        /*
         * A-Frameのカメラはローカル-Z方向が正面です。
         *
         * yaw：
         * 左右方向
         *
         * pitch：
         * 上下方向
         */
        const yaw =
          Math.atan2(
            -direction.x,
            -direction.z
          );

        const pitch =
          Math.atan2(
            direction.y,
            horizontalDistance
          );

        /*
         * look-controlsが管理しているオブジェクトへ
         * 直接初期角度を設定します。
         */
        lookControls.yawObject.rotation.y =
          yaw;

        lookControls.pitchObject.rotation.x =
          pitch;

        this.directionWasSet = true;

        console.log(
          "Initial camera direction was set.",
          {
            cameraPosition: {
              x: cameraPosition.x,
              y: cameraPosition.y,
              z: cameraPosition.z
            },

            targetPosition: {
              x: targetPosition.x,
              y: targetPosition.y,
              z: targetPosition.z
            },

            distance:
              cameraPosition.distanceTo(
                targetPosition
              ),

            yawDegrees:
              THREE.MathUtils.radToDeg(yaw),

            pitchDegrees:
              THREE.MathUtils.radToDeg(pitch)
          }
        );
      }
    });


    /**
     * EHang 216のローター回転とホバリングを制御します。
     *
     * ・Rotor_CWから始まるEmptyを時計回り
     * ・Rotor_CCWから始まるEmptyを反時計回り
     * ・徐々に回転速度を上げる
     * ・機体をゆっくり上下させる
     * ・機体をわずかに前後左右へ傾ける
     */
    AFRAME.registerComponent(
      "ehang-hover-animation",
      {
        schema: {
          /*
           * ローターの目標回転速度。
           * 今回の指定に合わせて20にしています。
           */
          rotorSpeed: {
            type: "number",
            default: 20
          },

          /*
           * 目標回転速度へ近づく速さ。
           * 小さいほどゆっくり加速します。
           */
          acceleration: {
            type: "number",
            default: 1.2
          },

          /*
           * 動作確認済みのローター回転軸。
           */
          rotorAxis: {
            type: "string",
            default: "y"
          },

          /*
           * ホバリング時の上下運動の幅。
           *
           * モデルが300～500程度の座標スケールなら、
           * 0.1ではほぼ見えない可能性があります。
           * 今回は2.5にしています。
           */
          hoverHeight: {
            type: "number",
            default: 2.5
          },

          /*
           * 上下運動の速さ。
           */
          hoverSpeed: {
            type: "number",
            default: 1.0
          },

          /*
           * 前後方向の傾き。
           * 単位は度です。
           */
          pitchAmount: {
            type: "number",
            default: 0.8
          },

          /*
           * 左右方向の傾き。
           * 単位は度です。
           */
          rollAmount: {
            type: "number",
            default: 1.0
          },

          /*
           * 傾きの変化速度。
           */
          tiltSpeed: {
            type: "number",
            default: 0.65
          }
        },

        init: function () {
          this.rotors = [];
          this.modelLoaded = false;

          this.currentRotorSpeed = 0;

          this.targetRotorSpeed =
            this.data.rotorSpeed;

          /*
           * HTMLで指定した機体の初期位置と回転を保存します。
           */
          this.basePosition =
            this.el.object3D.position.clone();

          this.baseRotation =
            this.el.object3D.rotation.clone();

          this.el.addEventListener(
            "model-loaded",
            () => {
              const model =
                this.el.getObject3D("mesh");

              if (!model) {
                console.error(
                  "GLBモデルを取得できませんでした。"
                );

                this.updateStatus(
                  "エラー：GLBモデルを取得できませんでした。",
                  "error"
                );

                return;
              }

              console.log(
                "EHang 216 GLB loaded."
              );

              model.traverse((object) => {
                const name =
                  object.name || "";

                if (
                  name.startsWith("Rotor_CW")
                ) {
                  this.rotors.push({
                    object: object,
                    direction: 1,
                    name: name
                  });

                  console.log(
                    "CW rotor found:",
                    name
                  );
                }

                if (
                  name.startsWith("Rotor_CCW")
                ) {
                  this.rotors.push({
                    object: object,
                    direction: -1,
                    name: name
                  });

                  console.log(
                    "CCW rotor found:",
                    name
                  );
                }
              });

              this.modelLoaded = true;

              if (
                this.rotors.length === 16
              ) {
                this.updateStatus(
                  "モデル読込成功：16個のローターを検出しました。",
                  "success"
                );
              } else {
                this.updateStatus(
                  `モデル読込成功：${this.rotors.length}個のローターを検出しました。`,
                  "warning"
                );
              }

              console.log(
                "Detected rotors:",
                this.rotors.map(
                  rotor => rotor.name
                )
              );
            }
          );

          this.el.addEventListener(
            "model-error",
            event => {
              console.error(
                "GLBの読み込みに失敗しました。",
                event.detail
              );

              this.updateStatus(
                "GLBの読み込みに失敗しました。ファイル名と配置場所を確認してください。",
                "error"
              );
            }
          );
        },

        updateStatus: function (
          message,
          type
        ) {
          const status =
            document.querySelector(
              "#status"
            );

          if (!status) {
            return;
          }

          status.textContent = message;
          status.className = type;
        },

        /**
         * 現在のローター速度を徐々に目標速度へ近づけます。
         */
        updateRotorSpeed: function (
          deltaSeconds
        ) {
          const difference =
            this.targetRotorSpeed -
            this.currentRotorSpeed;

          const interpolation =
            Math.min(
              1,
              this.data.acceleration *
              deltaSeconds
            );

          this.currentRotorSpeed +=
            difference *
            interpolation;
        },

        /**
         * 検出した16個のローターを回転させます。
         */
        rotateRotors: function (
          deltaSeconds
        ) {
          const rotationAmount =
            this.currentRotorSpeed *
            deltaSeconds;

          this.rotors.forEach(
            rotor => {
              const amount =
                rotationAmount *
                rotor.direction;

              if (
                this.data.rotorAxis === "x"
              ) {
                rotor.object.rotation.x +=
                  amount;
              } else if (
                this.data.rotorAxis === "y"
              ) {
                rotor.object.rotation.y +=
                  amount;
              } else {
                rotor.object.rotation.z +=
                  amount;
              }
            }
          );
        },

        /**
         * 機体をゆっくり上下させます。
         */
        updateHoverPosition: function (
          elapsedSeconds
        ) {
          const verticalOffset =
            Math.sin(
              elapsedSeconds *
              this.data.hoverSpeed
            ) *
            this.data.hoverHeight;

          this.el.object3D.position.y =
            this.basePosition.y +
            verticalOffset;
        },

        /**
         * 機体をわずかに前後左右へ傾けます。
         */
        updateHoverTilt: function (
          elapsedSeconds
        ) {
          const pitchDegrees =
            Math.sin(
              elapsedSeconds *
              this.data.tiltSpeed
            ) *
            this.data.pitchAmount;

          const rollDegrees =
            Math.sin(
              elapsedSeconds *
              this.data.tiltSpeed *
              0.83 +
              1.4
            ) *
            this.data.rollAmount;

          const pitchRadians =
            THREE.MathUtils.degToRad(
              pitchDegrees
            );

          const rollRadians =
            THREE.MathUtils.degToRad(
              rollDegrees
            );

          this.el.object3D.rotation.x =
            this.baseRotation.x +
            pitchRadians;

          this.el.object3D.rotation.z =
            this.baseRotation.z +
            rollRadians;
        },

        tick: function (
          time,
          delta
        ) {
          if (!this.modelLoaded) {
            return;
          }

          const deltaSeconds =
            delta / 1000;

          const elapsedSeconds =
            time / 1000;

          this.updateRotorSpeed(
            deltaSeconds
          );

          this.rotateRotors(
            deltaSeconds
          );

          this.updateHoverPosition(
            elapsedSeconds
          );

          this.updateHoverTilt(
            elapsedSeconds
          );
        }
      }
    );
  </script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #status {
      position: fixed;
      z-index: 10;

      top: 12px;
      left: 12px;
      right: 12px;

      max-width: 650px;

      padding: 10px 14px;

      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);

      border-radius: 8px;

      font-size: 14px;
      line-height: 1.5;

      pointer-events: none;
    }

    #status.success {
      background:
        rgba(0, 110, 60, 0.85);
    }

    #status.warning {
      background:
        rgba(170, 90, 0, 0.88);
    }

    #status.error {
      background:
        rgba(170, 0, 0, 0.88);
    }

    #guide {
      position: fixed;
      z-index: 10;

      left: 50%;
      bottom: 18px;

      transform:
        translateX(-50%);

      padding: 8px 14px;

      color: #ffffff;
      background:
        rgba(0, 0, 0, 0.62);

      border-radius: 20px;

      font-size: 13px;
      white-space: nowrap;

      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">
    EHang 216を読み込んでいます。
  </div>

  <div id="guide">
    ドラッグまたはスマートフォンを動かして周囲を見回せます
  </div>

  <a-scene
    background="color: #CFE5F2"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"
  >
    <a-assets timeout="30000">
      <a-asset-item
        id="ehangModel"

        src="./models/Ehang216_for_AFrame_Optimization.glb?v=7"
      ></a-asset-item>
    </a-assets>

    <!-- 環境光 -->
    <a-entity
      light="
        type: ambient;
        color: #FFFFFF;
        intensity: 1.3;
      "
    ></a-entity>

    <!-- 主光源 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 1.8;
      "

      position="-250 400 250"
    ></a-entity>

    <!-- 補助光 -->
    <a-entity
      light="
        type: directional;
        color: #FFFFFF;
        intensity: 0.7;
      "

      position="250 150 -250"
    ></a-entity>

    <!--
      EHang 216

      機体を原点付近へ配置しています。
      Y=50は、地面から少し浮かせるためです。
    -->
    <a-entity
      id="ehang216"

      gltf-model="#ehangModel"

      ehang-hover-animation="
        rotorSpeed: 20;
        acceleration: 1.2;
        rotorAxis: y;

        hoverHeight: 2.5;
        hoverSpeed: 1.0;

        pitchAmount: 0.8;
        rollAmount: 1.0;
        tiltSpeed: 0.65;
      "

      position="0 50 0"

      rotation="0 270 0"

      scale="1 1 1"
    ></a-entity>

    <!-- 地面 -->
    <a-plane
      position="0 0 0"

      rotation="-90 0 0"

      width="1500"
      height="1500"

      color="#AAB7C2"
      roughness="1"
    ></a-plane>

    <!--
      カメラリグ

      機体位置：
      0 50 0

      カメラ位置：
      -280 130 280

      距離は約405です。

      cameraRigにはrotationを設定しません。
      初期視線はinitial-look-atが設定します。
    -->
    <a-entity
      id="cameraRig"

      position="-280 130 280"
    >
      <a-camera
        id="mainCamera"

        initial-look-at="
          target: #ehang216;
          targetOffsetY: 10;
        "

        look-controls="
          enabled: true;
          magicWindowTrackingEnabled: true;
          touchEnabled: true;
          mouseEnabled: true;
          reverseMouseDrag: false;
        "

        wasd-controls="
          enabled: false;
        "
      ></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
