<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Mission</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #fade {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 0;
      z-index: 10;
      transition: opacity 0.5s;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #video-after1,
    #video-after2 {
      display: none;
    }

    #btn-area {
      position: fixed;
      right: 5vw;
      bottom: 5vh;
      z-index: 20;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: #2fe0d0;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }

    #mentor {
      position: fixed;
      left: 4vw;
      bottom: 4vh;
      z-index: 20;
      color: #fff;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div id="fade"></div>

  <video id="video-before" src="taxi_before.mp4" preload="auto"></video>
  <video id="video-after1" src="taxi_after1.mp4" preload="auto"></video>
  <video id="video-after2" src="taxi_after2.mp4" preload="auto"></video>

  <div id="mentor"></div>

  <div id="btn-area">
    <button onclick="start()">スタート</button>
  </div>

  <script>
    const videoBefore = document.getElementById("video-before");
    const videoAfter1 = document.getElementById("video-after1");
    const videoAfter2 = document.getElementById("video-after2");

    let currentVideo = videoBefore;

    const fade = document.getElementById("fade");
    const mentor = document.getElementById("mentor");
    const btnArea = document.getElementById("btn-area");

    let phase = "intro";

    function showMessage(text, time = 3000) {
      mentor.innerText = text;

      if (time > 0) {
        setTimeout(() => {
          mentor.innerText = "";
        }, time);
      }
    }

    function start() {
      btnArea.style.display = "none";

      showMessage("お客さんをスタジアムまで連れて行ってくれ！", 3000);

      videoBefore.play();
      phase = "before";

      videoBefore.onended = showChoice;
    }

    videoBefore.addEventListener("timeupdate", () => {
      if (phase === "before" && videoBefore.currentTime > 3) {
        showMessage("スタジアムに近づいてきたな！", 2000);
        phase = "before2";
      }
    });

    function showChoice() {
      videoBefore.pause();

      btnArea.style.display = "block";
      btnArea.innerHTML = `
        <button onclick="select(1)">少し待機</button>
        <button onclick="select(2)">別ポートへ</button>
      `;

      showMessage("ポートが混んでるぞ！どうする？", 0);
    }

    function select(n) {
      btnArea.style.display = "none";
      fade.style.opacity = 1;

      setTimeout(() => {

        let nextVideo;

        if (n === 1) {
          nextVideo = videoAfter1;
        } else {
          nextVideo = videoAfter2;
        }

        currentVideo.style.display = "none";
        nextVideo.style.display = "block";

        currentVideo = nextVideo;
        currentVideo.currentTime = 0;

        currentVideo.play();

        fade.style.opacity = 0;

        setTimeout(() => {
          if (n === 1) {
            showMessage("良い判断だ！もうすぐ降りられるぞ。", 3000);
          } else {
            showMessage("良い判断だ！別ポートへ向かおう。", 3000);
          }
        }, 1000);

        currentVideo.onended = finish;

      }, 500);
    }

    function finish() {
      showMessage("任務完了。よくやったな！", 0);

      btnArea.style.display = "block";
      btnArea.innerHTML = `<button onclick="location.reload()">リセット</button>`;
    }
  </script>

</body>
</html>
