<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTOL VR FIXED</title>

<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<style>
body,html{margin:0;height:100%;overflow:hidden;background:#000;}

#fade{
position:fixed;
width:100%;
height:100%;
background:#000;
opacity:0;
transition:opacity 1200ms ease;
z-index:999;
pointer-events:none;
}

#videoLayer{
position:fixed;
width:100%;
height:100%;
display:none;
z-index:1000;
background:#000;
}

video{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>

<div id="fade"></div>

<div id="videoLayer">
<video id="video" playsinline webkit-playsinline src="niagara.mp4"></video>
</div>

<a-scene embedded>

<a-assets>
<a-asset-item id="model" src="beta_alia_vtol_aircraft.glb"></a-asset-item>
<img id="bg" src="test4.jpg">
</a-assets>

<a-sky src="#bg"></a-sky>

<a-entity id="aircraft" position="0 -15 -70">
<a-gltf-model src="#model" scale="6 6 6"></a-gltf-model>
</a-entity>

<a-entity camera look-controls></a-entity>

</a-scene>

<script>

const aircraft = document.getElementById("aircraft");
const video = document.getElementById("video");
const fade = document.getElementById("fade");
const scene = document.querySelector("a-scene");
const videoLayer = document.getElementById("videoLayer");

// ===== 調整 =====
const TAKEOFF = 5000;
const FORWARD = 3500;
const EXTRA = 2000;
const FADE_LEAD = 300;

video.volume = 0.3;

// 初回クリックで開始（重要）
document.body.addEventListener("click", start, { once:true });

function start(){

// 動画再生許可を確保
video.play().then(()=>{
video.pause();
video.currentTime = 0;
}).catch(()=>{});

// ===== 離陸 =====
aircraft.setAttribute("animation__takeoff",{
property:"position",
from:"0 -15 -70",
to:"0 30 -70",
dur:TAKEOFF,
easing:"easeInOutQuad"
});

// ===== 前進 =====
setTimeout(()=>{

// 既存アニメーション削除（重要）
aircraft.removeAttribute("animation__forward");

aircraft.setAttribute("animation__forward",{
property:"position",
from:"0 30 -70",
to:"30 32 -20", // ← 距離を安定範囲に調整
dur:FORWARD,
easing:"linear"
});

// フェード
const fadeStart = FORWARD + EXTRA - FADE_LEAD;

setTimeout(()=>{
fade.style.opacity = 1;
},fadeStart);

// 動画切替
setTimeout(()=>{

scene.style.display="none";
videoLayer.style.display="block";

video.currentTime = 0;
video.volume = 0.3;

video.play().catch(()=>{});

setTimeout(()=>{
fade.style.opacity = 0;
},100);

},FORWARD + EXTRA);

},TAKEOFF);

}

</script>

</body>
</html>
