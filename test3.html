<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VTOL VR - Panorama Takeoff</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
      }

      #ui-container {
        position: fixed;
        bottom: 40px;
        left: 0;
        width: 100%;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }

      #mentor-panel {
        width: 80%;
        max-width: 560px;
        background: rgba(0, 20, 40, 0.92);
        border-left: 5px solid #00d4ff;
        padding: 15px;
        color: #fff;
        border-radius: 4px;
        margin-bottom: 20px;
        display: none;
        opacity: 0;
        transition: opacity 0.5s;
        font-size: 14px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }

      .action-btn {
        pointer-events: auto;
        background: #00d4ff;
        color: #000;
        border: none;
        padding: 15px 35px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 4px 15px rgba(0,212,255,0.4);
        -webkit-tap-highlight-color: transparent;
      }

      #fade-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        opacity: 0;
        z-index: 95000;
        pointer-events: none;
        transition: 1.2s;
      }
    </style>
  </head>

  <body>
    <div id="fade-overlay"></div>

    <div id="ui-container">
      <div id="mentor-panel">M: <span id="mentor-text"></span></div>
      <div id="btn-area">
        <button id="btn-main" class="action-btn" onclick="handleStart()">システム起動</button>
      </div>
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="antialias: true; colorManagement: true;"
    >
      <a-assets>
        <!-- 背景パノラマ -->
        <img id="pano-bg" src="test4.jpg">

        <!-- 機体 -->
        <a-asset-item id="car-model" src="beta_alia_vtol_aircraft.glb"></a-asset-item>
      </a-assets>

      <!-- 360度背景 -->
      <!-- 必要に応じて rotation のY値だけ微調整してください -->
      <a-sky
        id="sky-bg"
        src="#pano-bg"
        radius="100"
        rotation="0 -90 0"
        segments-width="64"
        segments-height="64"
      ></a-sky>

      <!-- 照明 -->
      <a-entity light="type: ambient; intensity: 1.1"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="3 8 2"></a-entity>

      <!-- 機体本体 -->
      <!-- ここを動かす -->
      <a-entity id="aircraft-rig" position="3 -1.2 -16" rotation="0 28 0">
        <a-gltf-model
          id="model-entity"
          src="#car-model"
          scale="0.85 0.85 0.85"
          rotation="0 180 0"
        ></a-gltf-model>
      </a-entity>

      <!-- カメラ -->
      <a-entity id="camera-rig" position="0 1.6 0">
        <a-entity
          id="main-camera"
          camera="active: true; fov: 70"
          look-controls="magic-window-trackingEnabled: true; touchEnabled: true"
        ></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const btnMain = document.getElementById('btn-main');
      const btnArea = document.getElementById('btn-area');
      const fade = document.getElementById('fade-overlay');

      const aircraftRig = document.getElementById('aircraft-rig');
      const model = document.getElementById('model-entity');
      const cam = document.getElementById('main-camera');

      const mentorPanel = document.getElementById('mentor-panel');
      const mentorText = document.getElementById('mentor-text');

      function showMentorMessage(text, duration = 3000) {
        mentorText.innerText = text;
        mentorPanel.style.display = "block";
        setTimeout(() => {
          mentorPanel.style.opacity = "1";
        }, 10);

        if (duration > 0) {
          setTimeout(() => {
            mentorPanel.style.opacity = "0";
            setTimeout(() => {
              mentorPanel.style.display = "none";
            }, 500);
          }, duration);
        }
      }

      // 機体色を白ベースに軽く整える
      model.addEventListener('model-loaded', () => {
        const mesh = model.getObject3D('mesh');
        if (!mesh) return;

        mesh.traverse((node) => {
          if (node.isMesh && node.material) {
            if (Array.isArray(node.material)) {
              node.material.forEach((mat) => {
                if (mat.color) mat.color.set('#f5f7fa');
                mat.needsUpdate = true;
              });
            } else {
              if (node.material.color) node.material.color.set('#f5f7fa');
              node.material.needsUpdate = true;
            }
          }
        });
      });

      async function handleStart() {
        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          try {
            const response = await DeviceOrientationEvent.requestPermission();
            if (response === 'granted') {
              cam.components['look-controls'].pause();
              cam.setAttribute('rotation', '0 0 0');
              cam.components['look-controls'].play();
            }
          } catch (e) {
            console.error(e);
          }
        }

        // ローター等のアニメーションがGLB側に入っていれば再生
        model.setAttribute('animation-mixer', 'clip: *; timeScale: 1.6');

        showMentorMessage('システム正常。離陸準備完了。', 2500);
        btnMain.innerText = '離陸開始';
        btnMain.setAttribute('onclick', 'handleTakeOff()');
      }

      function handleTakeOff() {
        btnArea.style.display = 'none';
        showMentorMessage('離陸シーケンス開始。上昇後、前方へ移行します。', 3500);

        // 念のため既存アニメーションを消す
        aircraftRig.removeAttribute('animation__rise');
        aircraftRig.removeAttribute('animation__forward');

        // Step1: 垂直離陸
        aircraftRig.setAttribute('animation__rise', {
          property: 'position',
          from: '3 -1.2 -16',
          to:   '3 6.5 -16',
          dur: 4200,
          easing: 'easeInOutQuad'
        });

        // Step2: 前方飛行
        setTimeout(() => {
          aircraftRig.setAttribute('animation__forward', {
            property: 'position',
            from: '3 6.5 -16',
            to:   '16 8.2 -42',
            dur: 5200,
            easing: 'easeInOutQuad'
          });
        }, 4300);

        // Step3: 少し遠ざかったらフェードして終了UI
        setTimeout(() => {
          fade.style.opacity = '1';
        }, 8600);

        setTimeout(() => {
          showMentorMessage('飛行シーケンス完了。もう一度実行できます。', 3000);
          btnArea.style.display = 'block';
          btnArea.innerHTML = `<button class="action-btn" onclick="location.reload()">Reset</button>`;
          fade.style.opacity = '0';
        }, 9800);
      }
    </script>
  </body>
</html>
