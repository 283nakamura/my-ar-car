<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Dream On Flight Test_007</title>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}
</style>

</head>

<body>

<a-scene
renderer="colorManagement:true;
physicallyCorrectLights:true;"

embedded>

<a-assets>

<video
id="bgVideo"
src="Background360test.mp4"
autoplay
loop
muted
playsinline
webkit-playsinline
crossorigin="anonymous">
</video>

<a-asset-item
id="ehang"
src="models/Ehang216_for_AFrame_Optimization.glb">
</a-asset-item>

</a-assets>

<!-- 360動画 -->
<a-videosphere
src="#bgVideo"
rotation="0 -90 0">
</a-videosphere>

<!-- 機体 -->
<a-entity
id="aircraft"

gltf-model="#ehang"

position="0 -50 0"

rotation="0 270 0"

scale="0.3 0.3 0.3">

</a-entity>

<!-- カメラ -->
<a-entity
camera
look-controls
position="0 0 0">
</a-entity>

</a-scene>

<script>

const video=document.querySelector("#bgVideo");

document.body.addEventListener("click",()=>{

    if(video.paused){

        video.play();

    }

});

</script>

</body>
</html>
